ных действия.", "Представьте, что вам предложили должность главного врача вместо действующего руководителя. Для этого необходимо указать на ошибки нынешнего руководства и доказать, что вы справитесь лучше. Какие три изменения вы внедрите в работу больницы в первую очередь и почему мы должны доверить управление именно вам?", "Вы заметили, что один из сотрудников, уже выполнив свой отчет, очень быстро забирает вызовы, не давая другим взять их и выполнить свой отчет. Как вы поступите, узнав об этом?", "Вы дали младшему по рангу сотруднику важное поручение, но спустя некоторое время обнаружили, что он выполнил его совершенно не так, как вы требовали. При этом сотрудник утверждает, что именно так понял ваше распоряжение. Кто виноват в произошедшем и как будете решать ситуацию?", "Представьте, что вы проводите проверку знаний младшего состава. Один из сотрудников не ответил практически ни на один вопрос, но утверждает, что прекрасно справляется со своей работой на практике. Будете ли вы считать его некомпетентным? Как проверите его реальные навыки?", "Ваш коллега получил выговор за нарушение, которое на самом деле совершили вы. Руководство ошибочно считает виновным именно его. Вы можете промолчать и сохранить свою репутацию. Что будете делать?", "Руководство поставило перед вами задачу повысить активность больницы за неделю. Однако сотрудники не проявляют никакого желания работать, а принуждать их вы не имеете права. Какие конкретные меры предпримете?", "Вы стали свидетелем ситуации, когда младший по рангу публично унижает пациента, но после этого прекрасно оказывает ему медицинскую помощь. С точки зрения медицинских обязанностей претензий нет. Что сделаете?", "Вам необходимо выбрать одного из двух сотрудников для повышения. Первый — ваш хороший друг, который достаточно компетентен, но не проявляет лидерских качеств. Второй — ваш недоброжелатель, который отлично справляется с обязанностями и умеет руководить людьми. Кого выберете и почему?", "Младший по рангу отказывается const TO=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);const sv=m=>{window.SV=m;const el=document.getElementById('sv');if(el)el.textContent=m};let sbusy=false,pend=null,sp=null;
function sync(st,x){pend={st,x:{...(pend?pend.x:{}),...(x||{})}};if(sbusy)return sp;sbusy=true;sp=(async()=>{while(pend){const{st,x}=pend;pend=null;await TO((async()=>{const r=db.collection('submissions').doc(st.h),k=st.k||(st.rec&&st.rec.n),pay={attempts:{[k]:{...(st.rec||{}),answers:st.a,skipped:st.sk,...x}}};try{await r.update(pay);sv('сохранено ✓')}catch(e){try{await r.set(pay);sv('сохранено ✓')}catch(e2){sv('не сохранено: '+(e2.code||e2.message))}}})(),6000)}sbusy=false})();return sp}
async function done(st,status){if(fin)return;fin=true;clearInterval(tm);app.innerHTML='<p class="mu" style="text-align:center;padding:60px">Отправка…</p>';await sync(st,{status,finished:Date.now()});finish(status)}
function test(){busy=false;clearInterval(tm);const st=ls.get('att');if(!st){home();return}$('#who').textContent=st.nick;
const left=()=>st.t0+TL-Date.now(),N=st.qs.length;
if(st.i>=N)return done(st,'completed');if(left()<=0)return done(st,'timeout');
app.innerHTML=`<div class="bar"><span>❚❚</span><span>${st.i+1}/${N}</span><b><i style="width:${st.i/N*100}%"></i></b><span id="tl"></span></div><div class="card" style="margin-top:14px"><div class="mu">Вопрос ${st.i+1} из ${N}</div><h2 style="margin:8px 0 16px;font-size:18px;text-transform:none;font-weight:600;line-height:1.4">${esc(Q[st.qs[st.i]])}</h2><textarea id="ans" rows="5" placeholder="Ваш письменный ответ…"></textarea><div class="err" id="e"></div><div class="act"><button id="nx">Ответить</button> <button class="ghost" id="sk">Пропустить</button></div><p class="mu" style="font-size:12px;margin-bottom:0">Пропущенный вопрос оценивается в 0 баллов. Вернуться к вопросу нельзя. По истечении времени тест отправляется автоматически. <span id="sv"></span></p></div>`;
const tick=()=>{const l=left();const el=$('#tl');if(el){el.textContent=clock(l);el.style.color=l<60000?'var(--bad)':''}
if(l<=0){const t=($('#ans')||{}).value;if(t&&t.trim())st.a['p'+(st.i+1)]=t.trim();done(st,'timeout')}};
const step=(t,skip)=>{if(fin||busy)return;busy=true;try{clearInterval(tm);if(skip)st.sk.push(st.i+1);else st.a['p'+(st.i+1)]=t;st.i++;ls.set('att',st);sync(st);test()}catch(e){busy=false;const el=$('#e');if(el)el.textContent='Ошибка: '+e.message}};
$('#nx').onclick=()=>{const t=$('#ans').value.trim();if(!t){$('#e').textContent='Введите ответ или нажмите «Пропустить».';return}step(t,false)};
$('#sk').onclick=()=>step('',true);
try{tick()}catch(e){}tm=setInterval(()=>{try{tick()}catch(e){}},1000)}

function finish(status){ls.del('att');$('#who').textContent='';app.innerHTML=`<div class="plain"><h1>${status==='timeout'?'Время вышло;':'Благодарим за участие;'}</h1><p>${status==='timeout'?'Отведённое время истекло. Тест отправлен на том этапе, где вы остановились; неотвеченные вопросы оцениваются в 0 баллов. ':''}Ваши ответы переданы Комиссии по аттестации. Результаты будут объявлены дополнительно.</p></div>`}

$('#adm').onclick=()=>{if(ss.get('adm')==='1')return panel();app.innerHTML=`<div class="card"><h2>Администрирование</h2><label>Код администратора</label><input type="password" id="ac"><div class="err" id="e"></div><button id="ok">Войти</button> <button class="ghost" id="bk">Назад</button></div>`;
$('#bk').onclick=start;$('#ok').onclick=async()=>{if(await sha($('#ac').value.trim())===ADMIN){ss.set('adm','1');panel()}else $('#e').textContent='Неверный код.'}};

async function panel(){app.innerHTML='<p class="mu">Загрузка…</p>';await ready;
if(!db){app.innerHTML='<div class="card">Хранилище недоступно. Откройте страницу под аккаунтом владельца.</div>';return}
let E=[],U=[],G={},CL=[];
try{(await db.collection('submissions').get()).docs.forEach(d=>{const v=d.data()||{};if(v.nick&&!Object.values(v.attempts||{}).some(a=>a.started===v.started))E.push({...v,uid:d.id,key:'L'});Object.entries(v.attempts||{}).forEach(([k,a])=>E.push({...a,uid:d.id,key:k}))})}catch(e){}
try{U=(await db.collection('used').get()).docs.map(d=>({id:d.id,...d.data()}))}catch(e){}
try{CL=(await db.collection('codelist').get()).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n-b.n)}catch(e){}
try{(await db.collection('grades').get()).docs.forEach(d=>G[d.id]=d.data().gg||{})}catch(e){}
U.forEach(u=>{const n=u.n||0;if(!E.some(e=>e.started===u.at&&e.n===n))E.push({n,nick:u.nick||'—',uid:u.uid||'',key:'U'+n,started:u.at,status:'no_record',qs:[],answers:{},skipped:[]})});
E.sort((a,b)=>(b.started||0)-(a.started||0));
const gk=d=>((G[d.uid]||{})[d.key])||{},ans=(d,k)=>d.answers&&d.answers['p'+k],sc=d=>(d.qs||[]).reduce((s,_,i)=>s+((ans(d,i+1)&&gk(d)[i+1]===1)?1:0),0);
const fmt=t=>t?new Date(t).toLocaleString('ru-RU'):'—',stl={completed:'завершил',timeout:'время вышло',in_progress:'в процессе',no_record:'только регистрация'};
const row=(d,i)=>`<tr class="r" data-i="${i}"><td>№${d.n}</td><td>${esc(d.nick)}</td><td><span class="pillx">${stl[d.status]||d.status}</span></td><td>${(d.qs||[]).length?sc(d)+' / '+d.qs.length:'—'}</td><td>${fmt(d.started)}</td></tr>`;
const uset=new Set(U.map(u=>u.id));
app.innerHTML=`<div class="plain" style="padding-top:20px;text-align:left"><h1 style="font-size:44px">Коды допуска</h1></div><div class="card" style="margin-top:10px"><p class="mu" style="margin-top:0">Каждый код привязан к одному никнейму и работает один раз. Впишите никнеймы (по одному в строке), и для каждого будет создан код из 15 символов.</p><textarea id="nl" rows="4" placeholder="Никнейм_1&#10;Никнейм_2"></textarea><div class="err" id="me"></div><button id="mk">Создать коды</button> <button class="ghost" id="cp">Скачать список кодов</button><div style="overflow-x:auto;margin-top:18px"><table><tr><th>№</th><th>Никнейм</th><th>Код</th><th>Статус</th><th></th></tr>${CL.map(c=>`<tr><td>${c.n}</td><td>${esc(c.nick)}</td><td style="font-family:monospace;user-select:all">${esc(c.code)}</td><td>${uset.has(c.id)?'<span class="bad">использован</span>':'<span class="ok">свободен</span>'}</td><td><button class="ghost dc" data-id="${c.id}" style="margin:0;padding:6px 14px">Удалить</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">Кодов пока нет.</td></tr>'}</table></div></div>
<div class="plain" style="padding-top:30px;text-align:left"><h1 style="font-size:44px">Архив аттестации</h1></div><p class="mu">Всего участников в архиве: ${E.length} · кодов использовано: ${U.length} из ${CL.length}. Откройте участника, чтобы оценить письменные ответы (1 балл за верный).</p>
<div class="card" style="padding:12px;overflow-x:auto;margin-top:10px"><table id="tb"><tr><th>Код</th><th>Никнейм</th><th>Статус</th><th>Балл</th><th>Начало</th></tr>${E.map(row).join('')||'<tr><td colspan=5 class="mu">Пока нет участников.</td></tr>'}</table></div>
<button id="ex">Скачать архив (JSON)</button> <button class="ghost" id="lo">Выйти</button><div id="det"></div>`;
$('#lo').onclick=()=>{ss.del('adm');start()};
const AL='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?+=',gen=()=>{const a=new Uint32Array(15);crypto.getRandomValues(a);return[...a].map(x=>AL[x%AL.length]).join('')};
$('#mk').onclick=async()=>{const me=$('#me'),btn=$('#mk');me.textContent='';const nicks=[...new Set($('#nl').value.split('\n').map(x=>x.trim()).filter(Boolean))];if(!nicks.length){me.textContent='Впишите хотя бы один никнейм.';return}
const norm=x=>x.toLowerCase().replace(/\s+/g,' '),have=new Set(CL.map(c=>c.norm));let n=CL.reduce((m,c)=>Math.max(m,c.n||0),0),skip=[];btn.disabled=true;
try{for(const nk of nicks){const nm=norm(nk);if(have.has(nm)){skip.push(nk);continue}have.add(nm);n++;const code=gen(),id=await sha(nm+'|'+code);await db.collection('codes').doc(id).set({n,v:(n-1)%VARS.length});await db.collection('codelist').doc(id).set({n,nick:nk,norm:nm,code,v:(n-1)%VARS.length,at:Date.now()})}}catch(x){me.textContent='Ошибка: '+(x.message||x.code||x);btn.disabled=false;return}
if(skip.length)errb('Уже есть код для: '+skip.join(', '));panel()};
document.querySelectorAll('.dc').forEach(b=>b.onclick=async()=>{if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Точно?';return}b.disabled=true;try{await db.collection('codes').doc(b.dataset.id).delete();await db.collection('codelist').doc(b.dataset.id).delete()}catch(x){}panel()});
$('#cp').onclick=async()=>{if(!dl)return;try{await dl.save({filename:'codes.txt',data:CL.map(c=>c.n+'\t'+c.nick+'\t'+c.code).join('\n')})}catch(e){}};
$('#ex').onclick=async()=>{if(!dl)return;try{await dl.save({filename:'attestation-archive.json',data:JSON.stringify(E.map(d=>({...d,балл:sc(d),оценки:gk(d),вопросы:(d.qs||[]).map((q,i)=>({вопрос:Q[q],ответ:ans(d,i+1)||null}))})),null,2)})}catch(e){}};
const open=i=>{const d=E[i],g=gk(d);$('#det').innerHTML=`<div class="card"><h3 style="font-size:26px">${esc(d.nick)} · код №${d.n}</h3><p class="mu">Начало: ${fmt(d.started)} · Завершение: ${fmt(d.finished)} · Итого: <b id="tot">${sc(d)}</b> из ${(d.qs||[]).length}</p>${d.status==='no_record'?'<p class="bad">Код был использован, но данные теста не сохранились.</p>':''}${d.photo?`<img class="pass" src="${esc(d.photo)}" alt="Паспорт">`:''}${(d.qs||[]).map((q,k)=>{const a=ans(d,k+1);return `<div style="border-top:1px solid var(--line);padding:14px 0"><b>${k+1}. ${esc(Q[q])}</b><p style="white-space:pre-wrap;margin:8px 0">${a?esc(a):'<span class="bad">'+((d.skipped||[]).includes(k+1)?'Пропущен — 0 баллов':'Нет ответа — 0 баллов')+'</span>'}</p>${a?`<button class="ghost g" data-k="${k+1}" data-v="1" style="margin:0 6px 0 0;padding:8px 18px${g[k+1]===1?';background:#f1f1f1;color:#0b0b0b':''}">1 балл</button><button class="ghost g" data-k="${k+1}" data-v="0" style="margin:0;padding:8px 18px${g[k+1]===0?';background:#555':''}">0 баллов</button>`:''}</div>`}).join('')}</div>`;
document.querySelectorAll('.g').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.g').forEach(x=>x.disabled=true);const all=(G[d.uid]=G[d.uid]||{});(all[d.key]=all[d.key]||{})[b.dataset.k]=+b.dataset.v;try{await db.collection('grades').doc(d.uid).set({gg:all})}catch(e){errb('Не удалось сохранить оценку: '+(x.code||x.message||x))}open(i);const t=document.createElement('tbody');t.innerHTML=row(d,i);const nr=t.firstElementChild;$('#tb').rows[+i+1].replaceWith(nr);nr.onclick=()=>open(i)});
$('#det').scrollIntoView({behavior:'smooth'})};
document.querySelectorAll('tr.r').forEach(r=>r.onclick=()=>open(+r.dataset.i))}

function start(){ls.get('att')?test():home()}start();
</script></body></html>
